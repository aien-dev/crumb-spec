[package]
name = "crumb-spec"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0 WITH LLVM-exception"
authors = ["AIEN Sovereign Systems & Contributors <sovereign@aien.dev>"]
description = "Crumb Protocol specification, cryptographic ledger, and verification test suite"
repository = "https://github.com/aien-dev/crumb-spec"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
blake3 = "1.5"
bincode = "1.3"
thiserror = "1.0"
uuid = { version = "1.7", features = ["v4", "v7", "serde"] }

[lib]
name = "crumb_spec"
path = "src/lib.rs"
